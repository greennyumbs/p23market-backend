services:
  db:
    image: postgres:15-alpine
    container_name: p23market-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p23market
    ports:
      - "5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p23market-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/p23market?schema=public"
      JWT_SECRET: "p23market-secret-key-change-me-in-production"
      PORT: 3000
    depends_on:
      - db

volumes:
  pgdata:
